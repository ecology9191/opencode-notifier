name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run validate

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Release tag ${RELEASE_TAG} (version ${tag_version}) does not match package.json (${pkg_version})."
            echo "Bump package.json, commit, then create a GitHub release tagged v${pkg_version}."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
